<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Shashank — Growth &amp; Performance Marketing</title>

    <!-- Static Open Graph tags for the home page. These are duplicated from
         src/content/site.js on purpose: LinkedIn's and WhatsApp's crawlers do
         not execute JavaScript, so whatever components/Meta.jsx writes at
         runtime is invisible to them. Only what is physically in this file
         counts. Case study pages fall back to these — they get a generic
         preview, which is the accepted tradeoff. Keep in sync with site.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shashank — Growth &amp; Performance Marketing" />
    <meta property="og:title" content="Shashank — Growth &amp; Performance Marketing" />
    <meta property="og:description" content="I change how a funnel works, not just what runs through it. Growth, performance marketing and product at Rehamo." />
    <meta property="og:url" content="https://shashank-rathor.github.io/" />
    <meta property="og:image" content="https://shashank-rathor.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shashank — Growth &amp; Performance Marketing" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shashank — Growth &amp; Performance Marketing" />
    <meta name="twitter:description" content="I change how a funnel works, not just what runs through it. Growth, performance marketing and product at Rehamo." />
    <meta name="twitter:image" content="https://shashank-rathor.github.io/og.png" />
