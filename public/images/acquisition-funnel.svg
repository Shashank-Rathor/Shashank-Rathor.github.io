<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="64" y="76" font-size="30" font-weight="700" fill="#1A1916" letter-spacing="-0.5">From ad to sale — and what fires along the way</text>
  <text x="64" y="108" font-size="16" fill="#6B6961">Every enquiry route a real customer uses, each one instrumented.</text>
  <line x1="64" y1="132" x2="1536" y2="132" stroke="#C9C4B4" stroke-width="1"/>

  <!-- ── stage 1 ── -->
  <rect x="64" y="200" width="250" height="96" fill="#1A1916"/>
  <text x="84" y="236" font-size="12" fill="#C9F24D" letter-spacing="2">01 · INTENT</text>
  <text x="84" y="266" font-size="22" font-weight="700" fill="#EFEBDF">Google Search</text>
  <text x="84" y="286" font-size="13" fill="#A9A69A">Search only. Query visible.</text>

  <!-- killed channels -->
  <g opacity="0.55">
    <rect x="64" y="322" width="250" height="38" fill="none" stroke="#C2452A" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="84" y="346" font-size="13" fill="#C2452A">PMax — killed. No audience control.</text>
    <rect x="64" y="368" width="250" height="38" fill="none" stroke="#C2452A" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="84" y="392" font-size="13" fill="#C2452A">Shopping — cut back. Same reason.</text>
  </g>

  <path d="M314 248 H384" stroke="#1A1916" stroke-width="2.5"/>
  <path d="M384 248 l-12 -7 m12 7 l-12 7" stroke="#1A1916" stroke-width="2.5" fill="none"/>

  <!-- ── stage 2 ── -->
  <rect x="396" y="200" width="230" height="96" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
  <text x="416" y="236" font-size="12" fill="#1F6B4E" letter-spacing="2">02 · PAGE</text>
  <text x="416" y="266" font-size="22" font-weight="700" fill="#1A1916">Product page</text>
  <text x="416" y="286" font-size="13" fill="#6B6961">Top of a conversation, not a cart.</text>

  <!-- fan out to three routes -->
  <path d="M626 248 H676 M676 160 V400 M676 160 H724 M676 248 H724 M676 400 H724" stroke="#1A1916" stroke-width="2.5" fill="none"/>
  <path d="M724 160 l-12 -7 m12 7 l-12 7 M724 248 l-12 -7 m12 7 l-12 7 M724 400 l-12 -7 m12 7 l-12 7" stroke="#1A1916" stroke-width="2.5" fill="none"/>

  <!-- ── stage 3: the three routes ── -->
  <text x="736" y="118" font-size="12" fill="#1F6B4E" letter-spacing="2">03 · ENQUIRY ROUTES — ALL COUNT AS A LEAD</text>

  <rect x="736" y="130" width="260" height="62" fill="#F5D96B"/>
  <text x="756" y="160" font-size="19" font-weight="700" fill="#1A1916">Enquiry form</text>
  <text x="756" y="180" font-size="13" fill="#5A584F">Custom React — I built this</text>

  <rect x="736" y="218" width="260" height="62" fill="#F5D96B"/>
  <text x="756" y="248" font-size="19" font-weight="700" fill="#1A1916">WhatsApp</text>
  <text x="756" y="268" font-size="13" fill="#5A584F">CTA, built and configured</text>

  <rect x="736" y="370" width="260" height="62" fill="#F5D96B"/>
  <text x="756" y="400" font-size="19" font-weight="700" fill="#1A1916">Phone call</text>
  <text x="756" y="420" font-size="13" fill="#5A584F">Tap-to-call, tracked</text>

  <!-- converge -->
  <path d="M996 161 H1046 M996 249 H1046 M996 401 H1046 M1046 161 V401 M1046 281 H1104" stroke="#1A1916" stroke-width="2.5" fill="none"/>
  <path d="M1104 281 l-12 -7 m12 7 l-12 7" stroke="#1A1916" stroke-width="2.5" fill="none"/>

  <!-- ── stage 4 ── -->
  <rect x="1116" y="228" width="240" height="106" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
  <text x="1136" y="262" font-size="12" fill="#1F6B4E" letter-spacing="2">04 · ROUTING</text>
  <text x="1136" y="292" font-size="20" font-weight="700" fill="#1A1916">Admin dashboard</text>
  <text x="1136" y="312" font-size="13" fill="#6B6961">+ email alert. Both built</text>
  <text x="1136" y="328" font-size="13" fill="#6B6961">by me — no weekly export.</text>

  <path d="M1236 334 V392" stroke="#1A1916" stroke-width="2.5"/>
  <path d="M1236 392 l-7 -12 m7 12 l7 -12" stroke="#1A1916" stroke-width="2.5" fill="none"/>

  <!-- ── stage 5 ── -->
  <rect x="1116" y="404" width="240" height="86" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
  <text x="1136" y="438" font-size="12" fill="#1F6B4E" letter-spacing="2">05 · FOLLOW-UP</text>
  <text x="1136" y="466" font-size="20" font-weight="700" fill="#1A1916">Sales team</text>
  <text x="1136" y="484" font-size="13" fill="#6B6961">Longer cycle than a referral.</text>

  <path d="M1236 490 V548" stroke="#1A1916" stroke-width="2.5"/>
  <path d="M1236 548 l-7 -12 m7 12 l7 -12" stroke="#1A1916" stroke-width="2.5" fill="none"/>

  <!-- ── stage 6 ── -->
  <rect x="1116" y="560" width="240" height="96" fill="#1F6B4E"/>
  <text x="1136" y="594" font-size="12" fill="#C9F24D" letter-spacing="2">06 · SALE</text>
  <text x="1136" y="628" font-size="34" font-weight="700" fill="#FFFFFF">~25%</text>
  <text x="1210" y="628" font-size="14" fill="#CFE6DA">of all digital leads</text>

  <!-- ── measurement layer ── -->
  <line x1="64" y1="700" x2="1536" y2="700" stroke="#C9C4B4" stroke-width="1"/>
  <text x="64" y="736" font-size="12" fill="#C2452A" letter-spacing="2">THE MEASUREMENT LAYER — BUILT ALONGSIDE, NOT AFTER</text>

  <rect x="64" y="752" width="340" height="88" fill="#EDEAE0"/>
  <text x="84" y="784" font-size="18" font-weight="700" fill="#1A1916">GTM + GA4 events</text>
  <text x="84" y="806" font-size="13" fill="#5A584F">One conversion event per route:</text>
  <text x="84" y="824" font-size="13" fill="#5A584F">form, WhatsApp, call.</text>

  <rect x="428" y="752" width="340" height="88" fill="#EDEAE0"/>
  <text x="448" y="784" font-size="18" font-weight="700" fill="#1A1916">Internal traffic filter</text>
  <text x="448" y="806" font-size="13" fill="#5A584F">Before this, staff activity counted</text>
  <text x="448" y="824" font-size="13" fill="#5A584F">as sessions. Baseline was fiction.</text>

  <rect x="792" y="752" width="340" height="88" fill="#EDEAE0"/>
  <text x="812" y="784" font-size="18" font-weight="700" fill="#1A1916">Closed-loop revenue</text>
  <text x="812" y="806" font-size="13" fill="#5A584F">Billing system reconciled against</text>
  <text x="812" y="824" font-size="13" fill="#5A584F">CRM + customer feedback.</text>

  <rect x="1156" y="752" width="380" height="88" fill="#1A1916"/>
  <text x="1176" y="784" font-size="18" font-weight="700" fill="#EFEBDF">4–5× ROAS</text>
  <text x="1176" y="806" font-size="13" fill="#A9A69A">Measured from billing, not from the</text>
  <text x="1176" y="824" font-size="13" fill="#A9A69A">figure the ad platform reports itself.</text>
</svg>
