<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="64" y="70" font-size="30" font-weight="700" fill="#1A1916" letter-spacing="-0.5">Six teams, one case — and where it fell over</text>
  <text x="64" y="100" font-size="16" fill="#6B6961">Every handoff below was verbal or a WhatsApp message. Cases didn't get lost inside a team. They stalled in the seams.</text><text x="64" y="900" font-size="0" fill="#fff"> </text>
  <line x1="64" y1="122" x2="1536" y2="122" stroke="#C9C4B4" stroke-width="1"/>

  <!-- assessment loop, drawn above the chain -->
  <path d="M424 208 C 424 176, 174 176, 174 208" fill="none" stroke="#C2452A" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M174 208 l-7 -13 m7 13 l7 -13" fill="none" stroke="#C2452A" stroke-width="2.5"/>
  <text x="299" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#C2452A">MOST FREQUENT FAILURE</text>
  <text x="299" y="156" text-anchor="middle" font-size="12.5" fill="#C2452A">verdict returns as a message — sometimes nobody actions it</text>

  <!-- the chain -->
  <g>
    <rect x="64" y="208" width="220" height="120" fill="#1A1916"/>
    <text x="84" y="238" font-size="11" fill="#C9F24D" letter-spacing="1.6">01</text>
    <text x="84" y="266" font-size="19" font-weight="700" fill="#EFEBDF">Inside sales</text>
    <text x="84" y="290" font-size="13" fill="#A9A69A">First contact,</text>
    <text x="84" y="308" font-size="13" fill="#A9A69A">qualification</text>

    <rect x="314" y="208" width="220" height="120" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
    <text x="334" y="238" font-size="11" fill="#1F6B4E" letter-spacing="1.6">02</text>
    <text x="334" y="266" font-size="19" font-weight="700" fill="#1A1916">Assessment</text>
    <text x="334" y="290" font-size="13" fill="#6B6961">Confirms the right</text>
    <text x="334" y="308" font-size="13" fill="#6B6961">product for the condition</text>

    <rect x="564" y="208" width="220" height="120" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
    <text x="584" y="238" font-size="11" fill="#1F6B4E" letter-spacing="1.6">03</text>
    <text x="584" y="266" font-size="19" font-weight="700" fill="#1A1916">Store</text>
    <text x="584" y="290" font-size="13" fill="#6B6961">Confirms availability,</text>
    <text x="584" y="308" font-size="13" fill="#6B6961">reserves stock</text>

    <rect x="814" y="208" width="220" height="120" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
    <text x="834" y="238" font-size="11" fill="#1F6B4E" letter-spacing="1.6">04</text>
    <text x="834" y="266" font-size="19" font-weight="700" fill="#1A1916">Warehouse</text>
    <text x="834" y="290" font-size="13" fill="#6B6961">Picks, prepares,</text>
    <text x="834" y="308" font-size="13" fill="#6B6961">handles returns</text>

    <rect x="1064" y="208" width="220" height="120" fill="#FFFFFF" stroke="#1A1916" stroke-width="2"/>
    <text x="1084" y="238" font-size="11" fill="#1F6B4E" letter-spacing="1.6">05</text>
    <text x="1084" y="266" font-size="19" font-weight="700" fill="#1A1916">Delivery</text>
    <text x="1084" y="290" font-size="13" fill="#6B6961">Delivers, installs,</text>
    <text x="1084" y="308" font-size="13" fill="#6B6961">collects returns</text>

    <rect x="1314" y="208" width="220" height="120" fill="#FFFFFF" stroke="#C2452A" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="1334" y="238" font-size="11" fill="#C2452A" letter-spacing="1.6">06</text>
    <text x="1334" y="266" font-size="19" font-weight="700" fill="#1A1916">Service</text>
    <text x="1334" y="290" font-size="13" fill="#6B6961">Fitting, setup,</text>
    <text x="1334" y="308" font-size="13" fill="#6B6961">after-sale support</text>
  </g>

  <!-- working handoffs -->
  <g stroke="#1A1916" stroke-width="2.5" fill="none">
    <path d="M284 268 H306"/><path d="M306 268 l-11 -6 m11 6 l-11 6"/>
    <path d="M534 268 H556"/><path d="M556 268 l-11 -6 m11 6 l-11 6"/>
    <path d="M784 268 H806"/><path d="M806 268 l-11 -6 m11 6 l-11 6"/>
    <path d="M1034 268 H1056"/><path d="M1056 268 l-11 -6 m11 6 l-11 6"/>
  </g>

  <!-- the missing handoff -->
  <g>
    <path d="M1284 268 H1306" stroke="#C2452A" stroke-width="2.5" stroke-dasharray="4 6"/>
    <g stroke="#C2452A" stroke-width="3">
      <path d="M1288 254 l16 28"/><path d="M1304 254 l-16 28"/>
    </g>
  </g>
  <text x="1534" y="356" text-anchor="end" font-size="13" font-weight="700" fill="#C2452A">MOST DAMAGING — NOT BROKEN, ABSENT</text>
  <text x="1534" y="374" text-anchor="end" font-size="12.5" fill="#C2452A">No handoff existed. Service learned a case</text>
  <text x="1534" y="392" text-anchor="end" font-size="12.5" fill="#C2452A">existed when the customer rang to complain.</text>


  <!-- rental return: a separate path, doubling back with no owner -->
  <g>
    <path d="M1174 328 V372 H924 V346" fill="none" stroke="#1F6B4E" stroke-width="2.5" stroke-dasharray="9 6"/>
    <path d="M924 346 l-7 13 m7 -13 l7 13" fill="none" stroke="#1F6B4E" stroke-width="2.5"/>
    <rect x="596" y="392" width="396" height="46" fill="#EDEAE0"/>
    <text x="612" y="412" font-size="13" font-weight="700" fill="#1F6B4E">RENTAL RETURN — A SEPARATE PATH</text>
    <text x="612" y="430" font-size="12.5" fill="#5A584F">Doubles back to warehouse. No owner in the model.</text>
  </g>

  <!-- management -->
  <rect x="64" y="470" width="1470" height="48" fill="#EDEAE0"/>
  <text x="84" y="500" font-size="14" font-weight="700" fill="#1A1916">Management</text>
  <text x="212" y="500" font-size="13.5" fill="#5A584F">oversees the chain — and assembled reporting by asking each representative, one at a time.</text>

  <!-- coverage brackets -->
  <path d="M64 546 V566 H284 V546" fill="none" stroke="#1A1916" stroke-width="2"/>
  <text x="64" y="592" font-size="14" font-weight="700" fill="#1A1916">What the internal CRM covered</text>
  <text x="64" y="612" font-size="13" fill="#6B6961">One team of six</text>

  <path d="M64 646 V666 H1534 V646" fill="none" stroke="#1F6B4E" stroke-width="2.5"/>
  <text x="799" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#1F6B4E">Where the constraint actually was</text>
  <text x="799" y="716" text-anchor="middle" font-size="13.5" fill="#5A584F">Two years of usage reframed the problem: not sales record-keeping, but the seams nobody owned.</text>

  <!-- footer band -->
  <line x1="64" y1="748" x2="1536" y2="748" stroke="#C9C4B4" stroke-width="1"/><text x="64" y="770" font-size="12.5" font-style="italic" fill="#86837A">Simplified to the primary sale path and the rental return. Service-only cases, reassignments and exchanges carry their own lifecycles.</text>

  <rect x="64" y="790" width="466" height="88" fill="#F5D96B"/>
  <text x="84" y="820" font-size="17" font-weight="700" fill="#1A1916">Four features. Nothing else.</text>
  <text x="84" y="844" font-size="13" fill="#5A584F">Capture · status · assignment · reminders.</text>
  <text x="84" y="862" font-size="13" fill="#5A584F">Every other request refused until usage earned it.</text>

  <rect x="566" y="790" width="466" height="88" fill="#EDEAE0"/>
  <text x="586" y="820" font-size="17" font-weight="700" fill="#1A1916">The signal nobody predicted</text>
  <text x="586" y="844" font-size="13" fill="#5A584F">Status requests arriving from teams the tool</text>
  <text x="586" y="862" font-size="13" fill="#5A584F">was never built for.</text>

  <rect x="1068" y="790" width="466" height="88" fill="#1A1916"/>
  <text x="1088" y="820" font-size="17" font-weight="700" fill="#EFEBDF">Build → buy</text>
  <text x="1088" y="844" font-size="13" fill="#A9A69A">Vendor chosen against requirements from real</text>
  <text x="1088" y="862" font-size="13" fill="#A9A69A">usage, not a wishlist. Sales live; chain in rollout.</text>
</svg>
